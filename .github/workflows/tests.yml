name: tests

# The suite is the only thing standing between a refactor and a silently
# broken pipeline, and until now nothing ran it automatically.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # Not requirements.txt: that pulls ultralytics and torch (~2GB) for a
        # suite that loads a model in exactly one test, which `-m "not slow"`
        # below excludes; everything else injects a fake detector or exercises
        # pure geometry/colour maths. This comment used to claim NO test loaded
        # a model. That was wrong - test_detection.py builds a real Detector -
        # and the job failed on its first run against a clean environment.
        # the only module-level heavy imports in the whole project are sklearn
        # (polyfut_video/pipeline/team_classify.py) and flask (server.py, which
        # test_app_service imports for its endpoint tests). Everything else —
        # ultralytics, torch, openvino — is imported inside functions.
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy "opencv-python-headless>=4.9" \
                      "scipy>=1.12" "scikit-learn>=1.4" "flask>=3.0"

      - name: Run the suite
        # -m "not slow" excludes the single test that builds a real Detector and
        # therefore imports ultralytics. Without it this job fails on a clean
        # runner while passing on any machine that happens to have ultralytics
        # installed - which is exactly how it slipped through.
        run: pytest polyfut_v2/tests polyfut_video/tests -q -m "not slow"
