[pytest]
# `slow` was used by polyfut_video/tests/test_detection.py long before anything
# registered it, so every run printed PytestUnknownMarkWarning and, worse, the
# mark deselected nothing. Registering it is what makes `-m "not slow"` in CI a
# real filter rather than a no-op that happens to match a typo.
markers =
    slow: loads real YOLO weights (downloads them on first run); excluded in CI
